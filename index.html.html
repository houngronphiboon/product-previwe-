<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพิ่มรายการใหม่ - TV Scanner App</title>
  <!-- โหลด Tesseract.js สำหรับทำ OCR ฝั่ง Client-side -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Thonburi', -apple-system, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; padding: 20px; }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
    .header { padding: 18px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 18px; font-weight: bold; background: #f8fafc; color: #0f172a; }
    .content { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    
    .preview-box { width: 100%; height: 180px; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; justify-content: center; align-items: center; background: #f8fafc; overflow: hidden; position: relative; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .preview-placeholder { text-align: center; color: #94a3b8; font-size: 14px; }
    
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-outline { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-primary { background: #475569; color: #fff; }
    .btn-primary:hover { background: #334155; }
    .btn:active { opacity: 0.8; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; font-weight: bold; color: #1e293b; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .form-control:focus { border-color: #475569; box-shadow: 0 0 0 2px rgba(71,85,105,0.2); }
    textarea.form-control { resize: vertical; min-height: 80px; }
    
    .status-tag { font-size: 11px; color: #059669; font-weight: normal; margin-left: 6px; display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">เพิ่มรายการใหม่</div>
  <div class="content">
    
    <!-- แสดงรูปพรีวิว -->
    <div class="preview-box" id="previewBox">
      <div class="preview-placeholder" id="placeholder">📷 แสดงรูปภาพที่ถ่าย/เลือก</div>
      <img id="imgPreview" style="display:none;" />
    </div>

    <!-- 1. ปุ่มเลือกรูป -->
    <button class="btn btn-outline" onclick="document.getElementById('fileGallery').click()">📁 เลือกรูป</button>
    <input type="file" id="fileGallery" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">

    <!-- 2. ปุ่มถ่ายรูป (อยู่ใต้ปุ่มเลือกรูปตามตำแหน่งในแบบล่าสุด) -->
    <button class="btn btn-primary" onclick="document.getElementById('fileCamera').click()">📷 ถ่ายรูป (สแกนรุ่นอัตโนมัติ)</button>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelect(event)">

    <!-- ฟอร์มกรอกข้อมูล -->
    <div class="form-group">
      <label>ชื่อ/รุ่น <span class="status-tag" id="statusTag">✓ ดึงชื่อรุ่นอัตโนมัติสำเร็จ</span></label>
      <input type="text" id="modelInput" class="form-control" placeholder="ตัวอย่าง: 50A6500G หรือ 43 LINE TV">
    </div>

    <div class="form-group">
      <label>รายละเอียด</label>
      <textarea id="descInput" class="form-control" placeholder="ตัวอย่าง: สภาพเครื่อง 95%, ไม่มีรอยขีดข่วน..."></textarea>
    </div>

    <button class="btn btn-primary" style="margin-top: 10px;" onclick="saveData()">เพิ่มรายการ</button>
  </div>
</div>

<script>
  // ฟังก์ชันสกัดตัดคำให้เหลือเฉพาะรหัสรุ่นสั้นๆ
  function extractModelCode(text) {
    console.log("Raw OCR Text:\n", text);
    
    // Pattern 1: ดึงหลังคำว่า MODEL: หรือ MODEL (เช่น Hisense MODEL: 50A6500G -> 50A6500G)
    const modelMatch = text.match(/MODEL\s*:\s*([A-Z0-9-]+)/i);
    if (modelMatch) return modelMatch[1].trim();

    // Pattern 2: ดึงรุ่นของ TCL หรือป้าย กสทช. (เช่น TCL 43 LINE TV -> 43 LINE TV)
    const tclMatch = text.match(/TCL\s+([0-9]+\s+[A-Z\s]+TV)/i);
    if (tclMatch) return tclMatch[1].trim();

    // Pattern 3: ค้นหารหัสสินค้าทั่วไป (ตัวเลขผสมตัวอักษร)
    const genericMatch = text.match(/\b[A-Z0-9]{3,5}-[0-9]{2,4}-[0-9]{4}\b|\b[0-9]{2}[A-Z]{1,2}[0-9]{3,4}[A-Z]?\b/i);
    if (genericMatch) return genericMatch[0].trim();

    return "";
  }

  // จัดการเมื่อมีการถ่ายรูปหรือเลือกไฟล์
  async function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    // แสดงรูปภาพพรีวิว
    const imgPreview = document.getElementById('imgPreview');
    const placeholder = document.getElementById('placeholder');
    imgPreview.src = URL.createObjectURL(file);
    imgPreview.style.display = 'block';
    placeholder.style.display = 'none';

    const modelInput = document.getElementById('modelInput');
    const statusTag = document.getElementById('statusTag');
    
    modelInput.placeholder = "กำลังสแกนและวิเคราะห์ชื่อรุ่น...";
    statusTag.style.display = 'none';

    try {
      // เรียกใช้ Tesseract OCR วิเคราะห์ตัวหนังสือ
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(file);
      await worker.terminate();

      // ส่งข้อความไปสกัดเอาเฉพาะชื่อรุ่น
      const extractedModel = extractModelCode(ret.data.text);

      if (extractedModel) {
        modelInput.value = extractedModel;
        statusTag.innerText = "✓ ดึงชื่อรุ่นอัตโนมัติสำเร็จ";
        statusTag.style.color = "#059669";
        statusTag.style.display = 'inline';
      } else {
        modelInput.placeholder = "ตัวอย่าง: 50A6500G";
        alert("อ่านรหัสรุ่นไม่ชัดเจน กรุณากรอกชื่อรุ่นด้วยตนเอง");
      }
    } catch (err) {
      console.error("OCR Error:", err);
      modelInput.placeholder = "ตัวอย่าง: 50A6500G";
    }
  }

  function saveData() {
    const model = document.getElementById('modelInput').value;
    if (!model) { alert("กรุณากรอกชื่อ/รุ่น"); return; }
    alert("บันทึกข้อมูลสำเร็จ: " + model);
  }
</script>
</body>
</html>
