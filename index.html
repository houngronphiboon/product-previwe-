<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลสินค้า - Nueng Ron Phibun</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f2f2f7; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
    
    .media-box {
      border: 2px dashed #ccc; border-radius: 12px; height: 180px;
      display: flex; align-items: center; justify-content: center;
      background: #fafafa; margin-bottom: 15px; overflow: hidden; position: relative;
    }
    .media-box img { width: 100%; height: 100%; object-fit: contain; }
    
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn-action {
      border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    }
    .btn-gray { background: #e5e5ea; color: #1c1c1e; }
    .btn-blue { background: #007aff; color: white; }
    .btn-purple { background: #8e44ad; color: white; width: 100%; padding: 14px; font-size: 15px; margin-bottom: 12px; }
    .btn-green { background: #27ae60; color: white; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; }
    
    label { font-weight: bold; font-size: 15px; display: block; margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px;
      font-size: 15px; margin-bottom: 15px; outline: none;
    }
    textarea { height: 110px; resize: none; }
    
    .status-msg { font-size: 13px; text-align: center; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <!-- กล่องแสดงรูปภาพ -->
    <div class="media-box" id="mediaBox">
      <span style="color: #8e8e93;">ยังไม่ได้เลือกรูปภาพ</span>
    </div>

    <!-- ปุ่มอัปโหลด/ถ่ายรูป -->
    <div class="btn-grid">
      <button class="btn-action btn-gray" onclick="document.getElementById('fileGallery').click()">
        📁 เลือกรูป / วิดีโอ
      </button>
      <button class="btn-action btn-blue" onclick="document.getElementById('fileCamera').click()">
        📷 ถ่ายรูป
      </button>
    </div>

    <!-- Input สำหรับรับไฟล์ -->
    <input type="file" id="fileGallery" accept="image/*" style="display:none">
    <input type="file" id="fileCamera" accept="image/*" capture="environment" style="display:none">

    <!-- ฟอร์มกรอกข้อมูล -->
    <label>ชื่อ/รุ่น <span style="color: red;">*</span></label>
    <input type="text" id="prodName" placeholder="เช่น 43mu6103k">

    <label>รายละเอียด</label>
    <textarea id="prodDesc" placeholder="รายละเอียดสินค้า..."></textarea>

    <div id="aiStatus" class="status-msg"></div>

    <!-- ปุ่ม AI และ ปุ่มบันทึก -->
    <button id="aiBtn" class="btn-action btn-purple" onclick="analyzeWithAI()">
      ✨ ค้นหารายละเอียดสินค้าด้วย AI (จากชื่อรุ่น + รูปภาพ)
    </button>
    
    <button class="btn-action btn-green" onclick="saveData()">
      บันทึกสินค้าลงคลาวด์
    </button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">รายการสินค้าบน Cloud (อัปเดตเรียลไทม์)</h3>
    <div id="cloudDataList" style="color: #8e8e93; font-size: 14px;">ยังไม่มีข้อมูลบันทึก</div>
  </div>
</div>

<script>
  // URL Cloudflare Worker ที่สร้างไว้
  const WORKER_URL = "https://red-forest-388c.narakonone.workers.dev";

  let base64Image = "";

  const fileGallery = document.getElementById('fileGallery');
  const fileCamera = document.getElementById('fileCamera');
  const mediaBox = document.getElementById('mediaBox');
  const aiBtn = document.getElementById('aiBtn');
  const aiStatus = document.getElementById('aiStatus');

  // จัดการอัปโหลดรูปภาพ
  [fileGallery, fileCamera].forEach(input => {
    input.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          mediaBox.innerHTML = `<img src="${evt.target.result}">`;
          base64Image = evt.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
      }
    });
  });

  // ฟังก์ชันวิเคราะห์ด้วย AI ผ่าน Cloudflare Worker
  async function analyzeWithAI() {
    const prodName = document.getElementById('prodName').value;
    
    if (!prodName && !base64Image) {
      alert("กรุณากรอกชื่อ/รุ่น หรือเลือกรูปภาพก่อนวิเคราะห์ครับ");
      return;
    }

    aiBtn.disabled = true;
    aiStatus.innerText = "กำลังวิเคราะห์ข้อมูลด้วย AI...";

    const promptText = `วิเคราะห์สินค้า/อะไหล่จากชื่อรุ่น "${prodName}" และรูปภาพที่แนบมา ตอบกลับในรูปแบบ:
[ผลการวิเคราะห์โดย AI]
• สินค้า/อะไหล่: ${prodName || 'ตามภาพ'}
• สภาพสินค้า: อุปกรณ์ผ่านการตรวจเช็คเรียบร้อย พร้อมใช้งาน
• รายละเอียดเพิ่มเติม: (สรุปสั้นๆ ไม่เกิน 2 บรรทัด)`;

    const parts = [{ text: promptText }];
    if (base64Image) {
      parts.push({
        inline_data: {
          mime_type: "image/jpeg",
          data: base64Image
        }
      });
    }

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts }] })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        document.getElementById('prodDesc').value = data.candidates[0].content.parts[0].text;
        aiStatus.innerText = "วิเคราะห์สำเร็จ!";
      } else {
        aiStatus.innerText = "ไม่สามารถวิเคราะห์ได้ กรุณาลองใหม่อีกครั้ง";
      }
    } catch (err) {
      console.error(err);
      aiStatus.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ AI";
    } finally {
      aiBtn.disabled = false;
    }
  }

  // ฟังก์ชันบันทึกข้อมูล
  function saveData() {
    const name = document.getElementById('prodName').value;
    const desc = document.getElementById('prodDesc').value;

    if (!name) {
      alert("กรุณากรอกชื่อ/รุ่นสินค้า");
      return;
    }

    alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
    // สามารถเชื่อมต่อ Firebase หรือ Database ของคุณต่อได้ที่นี่
  }
</script>

</body>
</html>
