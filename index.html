<button onclick="checkConnection()">ทดสอบการเชื่อมต่อ</button>
<p id="connection-result">สถานะ: รอการทดสอบ...</p>

<script>
async function checkConnection() {
  const resultElement = document.getElementById('connection-result');
  resultElement.innerText = "กำลังเชื่อมต่อ...";
  
  try {
    const response = await fetch('https://Houngronphiboon.pythonanywhere.com/api/check-status');
    const data = await response.json();
    
    if (data.status === "online") {
      resultElement.style.color = "green";
      resultElement.innerText = "✅ " + data.message;
    }
  } catch (error) {
    resultElement.style.color = "red";
    resultElement.innerText = "❌ ไม่สามารถเชื่อมต่อกับ PythonAnywhere ได้";
    console.error("Connection error:", error);
  }
}
</script>
