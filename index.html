<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลสินค้า</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-ai { background-color: #8e44ad; color: white; }
    .btn-ai:hover { background-color: #732d91; }
    .btn-save { background-color: #27ae60; color: white; }
    .btn-save:hover { background-color: #219150; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .preview-img { max-width: 100%; height: auto; max-height: 200px; margin-top: 10px; border-radius: 6px; display: none; }
    .loading-status { font-size: 13px; color: #2980b9; margin-top: 5px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>บันทึกข้อมูลสินค้า</h2>
  <form id="productForm">
    <div class="form-group">
      <label for="productName">ชื่อสินค้า *</label>
      <input type="text" id="productName" placeholder="ระบุชื่อสินค้า" required>
    </div>

    <div class="form-group">
      <label for="productImage">รูปภาพสินค้า</label>
      <input type="file" id="productImage" accept="image/*" onchange="handleFileSelect(event)">
      <div id="uploadStatus" class="loading-status">กำลังบีบอัดรูปภาพ...</div>
      <img id="imagePreview" class="preview-img" alt="ตัวอย่างรูปภาพ">
    </div>

    <button type="button" class="btn-ai" id="btnAI" onclick="handleAnalyzeAI()">
      ✨ ค้นหารายละเอียดสินค้าด้วย AI
    </button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <div class="form-group">
      <label for="category">หมวดหมู่</label>
      <input type="text" id="category" placeholder="เช่น เครื่องใช้ไฟฟ้า, อะไหล่">
    </div>

    <div class="form-group">
      <label for="price">ราคา (บาท)</label>
      <input type="number" id="price" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
      <label for="description">รายละเอียดสินค้า</label>
      <textarea id="description" rows="4" placeholder="รายละเอียดสินค้าจะปรากฏที่นี่ หรือกรอกเพิ่มได้"></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn-save" id="btnSave">บันทึกข้อมูล</button>
    </div>
  </form>
</div>

<!-- Firebase SDK (Modular Version) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Configuration (ใส่ Config ของ Firebase คุณตรงนี้)
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const CLOUDINARY_UPLOAD_PRESET = "YOUR_CLOUDINARY_PRESET";
  const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUDINARY_NAME";
  const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // State เก็บไฟล์และ URL รูปที่ผ่านการอัปโหลดแล้ว
  let selectedFile = null;
  let compressedBlob = null;
  let uploadedImageUrl = ""; 

  // -------------------------------------------------------------
  // 1. ฟังก์ชันบีบอัดรูปภาพ (Client-side Image Compression)
  // -------------------------------------------------------------
  async function compressImage(file, maxWidth = 1024, quality = 0.7) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
        };
      };
    });
  }

  // Handle การเลือกไฟล์
  window.handleFileSelect = async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    selectedFile = file;
    uploadedImageUrl = ""; // รีเซ็ต URL เดิมเพราะเลือกรูปใหม่

    const statusEl = document.getElementById("uploadStatus");
    statusEl.style.display = "block";
    statusEl.innerText = "กำลังประมวลผลรูปภาพ...";

    // บีบอัดรูปภาพทันทีที่เลือก
    compressedBlob = await compressImage(file);

    // พรีวิวรูปภาพ
    const preview = document.getElementById("imagePreview");
    preview.src = URL.createObjectURL(compressedBlob);
    preview.style.display = "block";
    
    statusEl.style.display = "none";
  };

  // -------------------------------------------------------------
  // 2. ฟังก์ชันอัปโหลดรูปขึ้น Cloudinary (จะทำเฉพาะรูปที่ยังไม่อัปโหลด)
  // -------------------------------------------------------------
  async function uploadToCloudinary() {
    if (uploadedImageUrl) return uploadedImageUrl; // ถ้าเคยอัปโหลดแล้ว ให้คืนค่า URL เดิมเลย
    if (!compressedBlob) return "";

    const formData = new FormData();
    formData.append("file", compressedBlob);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });

    if (!response.ok) throw new Error("การอัปโหลดรูปภาพล้มเหลว");
    const data = await response.json();
    uploadedImageUrl = data.secure_url; // บันทึก URL เก็บไว้ reuse
    return uploadedImageUrl;
  }

  // -------------------------------------------------------------
  // 3. ปุ่ม AI: ทำงานเฉพาะเมื่อกดปุ่มนี้เท่านั้น
  // -------------------------------------------------------------
  window.handleAnalyzeAI = async function() {
    const productName = document.getElementById("productName").value.trim();
    if (!productName && !compressedBlob) {
      alert("กรุณากรอกชื่อสินค้า หรือเลือกรูปภาพก่อนวิเคราะห์ด้วย AI");
      return;
    }

    const btnAI = document.getElementById("btnAI");
    btnAI.disabled = true;
    btnAI.innerText = "⏳ AI กำลังวิเคราะห์ข้อมูล...";

    try {
      // ตัวอย่างโครงสร้างการส่ง Prompt ให้ Gemini API
      const promptText = `วิเคราะห์สินค้าชื่อ: "${productName}" และสรุปข้อมูลเป็น JSON รูปแบบ: {"category": "หมวดหมู่สินค้า", "description": "รายละเอียดสินค้าโดยย่อ"}`;
      
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const result = await response.json();
      const aiText = result.candidates[0].content.parts[0].text;
      
      // ดึง JSON จาก Response ของ AI
      const cleanJsonStr = aiText.replace(/```json|```/g, "").trim();
      const aiData = JSON.parse(cleanJsonStr);

      // นำข้อมูลจาก AI มาใส่ในฟอร์มให้ผู้ใช้ตรวจเช็ก/แก้ไข
      if (aiData.category) document.getElementById("category").value = aiData.category;
      if (aiData.description) document.getElementById("description").value = aiData.description;

    } catch (error) {
      console.error("AI Error:", error);
      alert("ไม่สามารถวิเคราะห์ข้อมูลด้วย AI ได้ในขณะนี้");
    } finally {
      btnAI.disabled = false;
      btnAI.innerText = "✨ ค้นหารายละเอียดสินค้าด้วย AI";
    }
  };

  // -------------------------------------------------------------
  // 4. ปุ่มกดบันทึกสินค้า (ทำงานเร็ว ตัดขั้นตอน AI ออกทั้งหมด)
  // -------------------------------------------------------------
  document.getElementById("productForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const btnSave = document.getElementById("btnSave");
    btnSave.disabled = true;
    btnSave.innerText = "⏳ กำลังบันทึกข้อมูล...";

    try {
      // ขั้นที่ 1: อัปโหลดรูปภาพไป Cloudinary (ถ้ามีรูป และยังไม่อัปโหลด)
      let imageUrl = "";
      if (compressedBlob) {
        imageUrl = await uploadToCloudinary();
      }

      // ขั้นที่ 2: ดึงข้อมูลจากฟอร์มโดยตรง ส่งลง Firestore
      const productData = {
        name: document.getElementById("productName").value.trim(),
        category: document.getElementById("category").value.trim(),
        price: parseFloat(document.getElementById("price").value) || 0,
        description: document.getElementById("description").value.trim(),
        imageUrl: imageUrl,
        createdAt: serverTimestamp()
      };

      await addDoc(collection(db, "products"), productData);

      alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
      
      // ล้างข้อมูลฟอร์ม
      document.getElementById("productForm").reset();
      document.getElementById("imagePreview").style.display = "none";
      selectedFile = null;
      compressedBlob = null;
      uploadedImageUrl = "";

    } catch (error) {
      console.error("Save Error:", error);
      alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + error.message);
    } finally {
      btnSave.disabled = false;
      btnSave.innerText = "บันทึกข้อมูล";
    }
  });
</script>

</body>
</html>
