<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลสินค้า - Nueng Ron Phibun Electronics</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .title { font-size: 18px; font-weight: bold; color: #1e293b; line-height: 1.4; }
    .status-group { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge-success { background-color: #d1e7dd; color: #0f5132; }
    .badge-danger { background-color: #f8d7da; color: #842029; }
    
    .media-box { width: 100%; height: 200px; border: 2px dashed #cbd5e1; border-radius: 12px; background-color: #1e293b; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; margin-bottom: 16px; overflow: hidden; position: relative; }
    .media-box img { width: 100%; height: 100%; object-fit: contain; }
    
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .btn { padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn-gray { background-color: #e2e8f0; color: #334155; }
    .btn-blue { background-color: #007bff; color: white; }
    .btn-purple { background-color: #8b5cf6; color: white; width: 100%; margin-bottom: 12px; padding: 14px; font-size: 15px; }
    .btn-green { background-color: #10b981; color: white; width: 100%; padding: 14px; font-size: 16px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .form-group { margin-bottom: 16px; }
    label { font-size: 14px; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
    input[type="text"]:focus, textarea:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    textarea { height: 120px; resize: vertical; }

    #toast { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 99; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    #toast.error { background-color: #dc3545; }
    #toast.success { background-color: #198754; }

    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="title">ระบบบันทึกข้อมูลสินค้า - Nueng Ron Phibun Electronics</div>
    <div class="status-group">
      <span class="badge badge-success">🟢 DB พร้อม</span>
      <span id="ai-status" class="badge badge-danger">🔴 AI ขัดข้อง</span>
    </div>
  </div>

  <div class="media-box" id="media-preview">
    [กรอบแสดงรูปภาพ / วิดีโอ]
  </div>

  <input type="file" id="file-input" accept="image/*" style="display: none;">
  
  <div class="btn-group">
    <button class="btn btn-gray" onclick="document.getElementById('file-input').click()">📁 เลือกรูป / วิดีโอ</button>
    <button class="btn btn-blue" onclick="document.getElementById('file-input').click()">📷 ถ่ายรูป</button>
  </div>

  <div class="form-group">
    <label>ชื่อ/รุ่น <span style="color:red;">*</span></label>
    <input type="text" id="product-name" placeholder="เช่น 32pht5853s หรือเบอร์ไอซี">
  </div>

  <div class="form-group">
    <label>รายละเอียด</label>
    <textarea id="product-detail" placeholder="กรอกรายละเอียดสินค้า อะไหล่ หรือกดให้ AI ช่วยวิเคราะห์"></textarea>
  </div>

  <button class="btn btn-purple" id="btn-ai" onclick="generateAIDetails()">
    ✨ ค้นหารายละเอียดสินค้าด้วย AI (จากชื่อรุ่น + รูปภาพ)
  </button>

  <button class="btn btn-green">
    บันทึกสินค้าลงคลาวด์
  </button>
</div>

<div id="toast"></div>

<script>
  // 1. กำหนด URL ของ Cloudflare Worker
  const WORKER_URL = 'https://misty-frog-8bb9.houngronphiboon.workers.dev'; 

  // ตัวแปรสำหรับเก็บข้อมูลรูปภาพที่เลือก
  let processedMedia = null;

  // จัดการการอัปโหลดรูปภาพ
  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        processedMedia = {
          type: 'image',
          data: evt.target.result // Base64 Data URL
        };
        const preview = document.getElementById('media-preview');
        preview.innerHTML = `<img src="${evt.target.result}" alt="Preview">`;
      };
      reader.readAsDataURL(file);
    }
  });

  // --- 2. ฟังก์ชันเช็คสถานะไฟ AI (Ping) ---
  async function checkAIStatus() {
    const statusBadge = document.getElementById('ai-status');
    if (!statusBadge) return;

    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
      });

      if (response.ok) {
        statusBadge.style.backgroundColor = '#d1e7dd';
        statusBadge.style.color = '#0f5132';
        statusBadge.innerHTML = '🟢 AI พร้อม';
      } else {
        throw new Error('Response status not ok');
      }
    } catch (error) {
      console.error("AI Status Check Failed:", error);
      statusBadge.style.backgroundColor = '#f8d7da';
      statusBadge.style.color = '#842029';
      statusBadge.innerHTML = '🔴 AI ขัดข้อง';
    }
  }

  // --- 3. ฟังก์ชันค้นหารายละเอียดสินค้า/อ่านรูปภาพด้วย AI ---
  window.generateAIDetails = async function() {
    const nameInput = document.getElementById('product-name');
    const detailInput = document.getElementById('product-detail');
    const name = nameInput.value.trim();

    const hasImage = processedMedia && processedMedia.type === 'image' && processedMedia.data;

    if (!name && !hasImage) {
      showToast("กรุณากรอกชื่อ/รุ่น หรือแนบรูปภาพก่อนกดวิเคราะห์", "error");
      return;
    }

    const originalText = detailInput.value;
    detailInput.value = `🔍 AI กำลังวิเคราะห์รูปภาพ อ่านรหัสพาร์ท และดึงสเปกจากเว็บ...`;
    setFormButtonsDisabled(true);

    try {
      const parts = [{ text: `รุ่นนี้: "${name}"` }];

      if (hasImage) {
        const base64Data = processedMedia.data.split(',')[1];
        const mimeType = processedMedia.data.split(';')[0].split(':')[1] || 'image/jpeg';
        parts.push({
          inline_data: { mime_type: mimeType, data: base64Data }
        });
      }

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: parts }] })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || `HTTP Error: ${response.status}`);
      }

      if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
        detailInput.value = data.candidates[0].content.parts[0].text;
        showToast("วิเคราะห์และดึงข้อมูลสำเร็จ", "success");
      } else {
        throw new Error("ไม่พบข้อมูลตอบกลับจากระบบ AI");
      }

    } catch (error) {
      console.error("AI Processing Error:", error);
      detailInput.value = originalText;
      showToast("เชื่อมต่อ AI ไม่สำเร็จ: " + error.message, "error");
    } finally {
      setFormButtonsDisabled(false);
    }
  };

  // ย้อนกลับสถานะปุ่ม
  function setFormButtonsDisabled(disabled) {
    document.getElementById('btn-ai').disabled = disabled;
  }

  // แจ้งเตือน Toast
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.className = `show ${type}`;
    toast.innerText = message;
    setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
  }

  // เรียกใช้เมื่อโหลดหน้าเว็บ
  document.addEventListener('DOMContentLoaded', checkAIStatus);
</script>

</body>
</html>
