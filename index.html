<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลสินค้า - Nueng Ron Phibun Electronics</title>
  
  <!-- Font Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 16px;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      color: #111827;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #2563eb;
    }

    /* ปุ่ม AI */
    .btn-ai {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      box-shadow: 0 2px 4px rgba(109, 40, 217, 0.2);
      transition: opacity 0.2s;
    }

    .btn-ai:hover {
      opacity: 0.95;
    }

    /* ปุ่มบันทึก */
    .btn-save {
      width: 100%;
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
      transition: background-color 0.2s;
    }

    .btn-save:hover {
      background-color: #15803d;
    }

    /* ตาราง Responsive */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      min-width: 480px; /* ป้องกันตารางบีบจนข้อความล้น */
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f9fafb;
      padding: 12px 14px;
      color: #4b5563;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }

    tr:hover {
      background-color: #f9fafb;
    }

    /* Badge สำหรับชนิดสื่อ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-video {
      background-color: #eff6ff;
      color: #2563eb;
    }

    .badge-image {
      background-color: #f0fdf4;
      color: #16a34a;
    }

    .badge-none {
      background-color: #f3f4f6;
      color: #6b7280;
    }

    .text-truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ฟอร์มป้อนข้อมูล -->
    <div class="card">
      <div class="header-title">ระบบบันทึกข้อมูลสินค้า - Nueng Ron Phibun Electronics</div>
      
      <div class="form-group">
        <label for="productName">ชื่อ / รุ่นสินค้า</label>
        <input type="text" id="productName" class="form-control" placeholder="เช่น 32d-2t, 32hs534an">
      </div>

      <div class="form-group">
        <label for="mediaType">ชนิดสื่อ</label>
        <select id="mediaType" class="form-control">
          <option value="ไม่มีสื่อ">ไม่มีสื่อ</option>
          <option value="รูปภาพ">รูปภาพ</option>
          <option value="วิดีโอ">วิดีโอ</option>
        </select>
      </div>

      <div class="form-group">
        <label for="productDetails">รายละเอียด</label>
        <input type="text" id="productDetails" class="form-control" placeholder="กรอกรายละเอียดสินค้า...">
      </div>

      <!-- ปุ่ม AI ค้นหา -->
      <button type="button" class="btn-ai" onclick="handleAISearch()">
        ✨ ค้นหารายละเอียดสินค้าด้วย AI (จากชื่อรุ่น + รูปภาพ)
      </button>

      <!-- ปุ่มบันทึก -->
      <button type="button" class="btn-save" onclick="handleSaveData()">
        บันทึกสินค้าลงคลาวด์
      </button>
    </div>

    <!-- ส่วนตารางแสดงรายการสินค้า -->
    <div class="card">
      <h3 style="margin: 0 0 12px 0; font-size: 18px; color: #111827;">
        รายการสินค้าบน <span style="color: #2563eb;">Cloud</span>
      </h3>

      <!-- ช่องค้นหา -->
      <div class="form-group">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 พิมพ์เพื่อค้นหารายการสินค้า..." onkeyup="filterProducts()">
      </div>

      <!-- ตารางรายการสินค้า -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 28%;">ชนิดสื่อ</th>
              <th style="width: 42%;">ชื่อ / รุ่น</th>
              <th style="width: 30%;">รายละเอียด</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- ข้อมูลจะแสดงผ่าน JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ข้อมูลเริ่มต้นสำหรับทดสอบ
    let products = [
      { mediaType: 'วิดีโอ', name: 'ทดสอบบันทึกไฟล์วิดีโอ', details: 'ไฟล์ทดสอบระบบวิดีโอ' },
      { mediaType: 'รูปภาพ', name: '32d-2t', details: 'เมนบอร์ดทีวี' },
      { mediaType: 'วิดีโอ', name: 'ทดสอบบันทึกวิดีโอ', details: 'คลิปทดสอบการทำงาน' },
      { mediaType: 'ไม่มีสื่อ', name: 'ทดสอบบันทึกวิดีโอ', details: 'ไม่มีไฟล์แนบ' },
      { mediaType: 'รูปภาพ', name: '32hs534an', details: 'อะไหล่จอภาพ' }
    ];

    // ฟังก์ชันสร้าง UI Badge แสดงชนิดสื่อ
    function getMediaTypeBadgeHTML(type) {
      if (type === 'วิดีโอ' || type === 'video') {
        return `<span class="badge badge-video">🎥 วิดีโอ</span>`;
      } else if (type === 'รูปภาพ' || type === 'image') {
        return `<span class="badge badge-image">🖼️ รูปภาพ</span>`;
      } else {
        return `<span class="badge badge-none">📷 ไม่มีสื่อ</span>`;
      }
    }

    // ฟังก์ชัน Render ตารางสินค้า
    function renderProductTable(items) {
      const tbody = document.getElementById('productTableBody');
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 20px; color: #9ca3af;">ไม่พบข้อมูลสินค้า</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => `
        <tr>
          <td>${getMediaTypeBadgeHTML(item.mediaType)}</td>
          <td style="font-weight: 600; color: #111827;">${item.name || '-'}</td>
          <td class="text-truncate" style="color: #6b7280;" title="${item.details || ''}">${item.details || '-'}</td>
        </tr>
      `).join('');
    }

    // ฟังก์ชันค้นหารายการสินค้า
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(item => 
        (item.name && item.name.toLowerCase().includes(query)) ||
        (item.details && item.details.toLowerCase().includes(query)) ||
        (item.mediaType && item.mediaType.toLowerCase().includes(query))
      );
      renderProductTable(filtered);
    }

    // ฟังก์ชันปุ่มบันทึกข้อมูล
    function handleSaveData() {
      const name = document.getElementById('productName').value;
      const mediaType = document.getElementById('mediaType').value;
      const details = document.getElementById('productDetails').value;

      if (!name) {
        alert('กรุณากรอกชื่อหรือรุ่นสินค้า');
        return;
      }

      // เพิ่มข้อมูลใหม่ลงใน Array
      products.unshift({ name, mediaType, details });
      renderProductTable(products);

      // เคลียร์ค่าในฟอร์ม
      document.getElementById('productName').value = '';
      document.getElementById('productDetails').value = '';
      alert('บันทึกข้อมูลสินค้าเรียบร้อยแล้ว!');
    }

    // ฟังก์ชันค้นหาด้วย AI (ตัวอย่าง)
    function handleAISearch() {
      alert('ระบบกำลังประมวลผลค้นหาข้อมูลด้วย AI...');
    }

    // เรียกแสดงผลครั้งแรกเมื่อโหลดหน้า
    renderProductTable(products);
  </script>

</body>
</html>
