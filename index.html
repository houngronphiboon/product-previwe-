<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์สเปกคอมเพรสเซอร์และอุปกรณ์</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #1a73e8;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #a0c3ff;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #eef4ff;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
            white-space: pre-line;
            line-height: 1.6;
        }
        .preview-img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ ระบบวิเคราะห์ข้อมูลเชิงช่าง & สเปกคอมเพรสเซอร์</h2>
    
    <label for="modelName">ชื่อรุ่น / เลขโมเดล:</label>
    <input type="text" id="modelName" placeholder="เช่น VETZ90L, 2L-II, หรือโมเดลตู้เย็น/แอร์">

    <label for="imageInput">อัปโหลดรูปภาพเพลท/ตัวเครื่อง (ถ้ามี):</label>
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    <img id="imagePreview" class="preview-img" alt="ตัวอย่างรูปภาพ">

    <button id="submitBtn" onclick="analyzeData()">ประมวลผลข้อมูล</button>

    <div id="result" class="result-box" style="display: none;"></div>
</div>

<script>
// ฟังก์ชันสำหรับแสดงตัวอย่างรูปภาพเมื่อเลือกไฟล์
function previewImage(event) {
    const reader = new FileReader();
    const preview = document.getElementById('imagePreview');
    reader.onload = function() {
        preview.src = reader.result;
        preview.style.display = 'block';
    };
    if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    } else {
        preview.style.display = 'none';
    }
}

// ฟังก์ชันแปลงไฟล์รูปภาพเป็น Base64
function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });
}

async function analyzeData() {
    const modelName = document.getElementById('modelName').value.trim();
    const imageInput = document.getElementById('imageInput');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    if (!modelName && imageInput.files.length === 0) {
        alert('กรุณากรอกชื่อรุ่นหรือเลือกรูปภาพอย่างน้อย 1 อย่าง');
        return;
    }

    // ล็อกปุ่มและแสดงสถานะ
    submitBtn.disabled = true;
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '⌛ กำลังวิเคราะห์ข้อมูลและค้นหาสเปก...';

    // =========================================================
    // 🛠️ ปรับปรุง System Instruction Prompt ให้ยืดหยุ่นเชิงช่าง
    // =========================================================
    const systemInstructionPrompt = `
คุณคือผู้เชี่ยวชาญด้านงานช่างอิเล็กทรอนิกส์ ช่างเครื่องเย็น และช่างยานยนต์ 
หน้าที่ของคุณคือระบุและวิเคราะห์สเปกเทคนิคให้ช่างนำไปใช้งานซ่อมได้จริง

หลักการประมวลผลข้อมูล:
1. ประมวลผลรูปภาพและชื่อรุ่นร่วมกัน (Cross-reference) เพื่อระบุยี่ห้อและรหัสคอมเพรสเซอร์/อุปกรณ์
2. ดึงและวิเคราะห์สเปกสำคัญดังนี้:
   - ปริมาณน้ำมันคอมเพรสเซอร์ (Oil Charge) และชนิดน้ำมัน (เช่น POE, Mineral) 
     *กรณีบนเพลตไม่ระบุ cc ให้ประเมินค่าช่วงมาตรฐานของตระกูลคอมเพรสเซอร์นั้นๆ (เช่น 160–180 cc) พร้อมระบุว่าเป็น "ค่าประเมินมาตรฐานโรงงานสำหรับงานซ่อม"*
   - ชนิดและปริมาณน้ำยาทำความเย็น (Refrigerant Type)
   - ระบบไฟฟ้า (Voltage, Hz, Phase, Inverter/Fixed Speed)
   - ขนาดตู้เย็น/แอร์ที่เหมาะสม หรือขนาดวัตต์ (Capacity)
3. สรุปผลให้อ่านง่าย ใช้สัญลักษณ์ไอคอนแบ่งหัวข้อชัดเจน สั้น กระชับ และตรงประเด็น
`;

    try {
        let base64Image = null;
        if (imageInput.files.length > 0) {
            base64Image = await convertFileToBase64(imageInput.files[0]);
        }

        // โครงสร้าง Payload เตรียมสำหรับส่งหา Gemini API
        const payload = {
            system_instruction: systemInstructionPrompt,
            model_name: modelName,
            image_data: base64Image
        };

        /* 
        // -------------------------------------------------------------
        // ตัวอย่างการส่ง Request ไปยัง Backend หรือ Gemini API Endpoint
        // -------------------------------------------------------------
        const response = await fetch('YOUR_API_ENDPOINT', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        resultDiv.innerHTML = data.text;
        */

        // สรุปผลลัพธ์จำลองโครงสร้างที่ AI จะตอบกลับมาตาม Prompt ใหม่
        resultDiv.innerHTML = `📍 <strong>การวิเคราะห์สเปก:</strong> ${modelName || "ตรวจพบจากรูปภาพ"}\n\n` +
            `🏷️ <strong>แบรนด์ / รุ่น:</strong> HUAGUANG VETZ90L\n` +
            `⚡ <strong>ระบบไฟฟ้า:</strong> Inverter 230V 60-225Hz (3-Phase)\n` +
            `❄️ <strong>สารทำความเย็น:</strong> R600a\n` +
            `🛢️ <strong>ปริมาณน้ำมันคอมฯ (Oil Charge):</strong> ประมาณ 160 – 180 cc (ชนิดน้ำมัน POE / Ester Oil)\n` +
            `💡 <strong>ข้อแนะนำงานซ่อม:</strong> หากถ่ายน้ำมันเก่าออก ให้ตวงปริมาณเดิมแล้วเติมกลับเท่าเดิม +10 cc เพื่อชดเชยที่ค้างในระบบ`;

    } catch (error) {
        resultDiv.innerHTML = '❌ เกิดข้อผิดพลาดในการประมวลผล กรุณาลองใหม่อีกครั้ง';
        console.error(error);
    } finally {
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
