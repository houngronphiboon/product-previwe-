<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลสินค้า - Nueng Ron Phiboon Electronics</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #007bff;
      --success: #28a745;
      --ai-btn: #7c4dff;
      --danger: #dc3545;
      --text: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2, h3 {
      text-align: center;
      margin-top: 0;
    }

    .media-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-media {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
    }

    .btn-file { background: #e9ecef; color: #495057; }
    .btn-camera { background: #007bff; color: white; }

    .preview-box {
      width: 100%;
      min-height: 180px;
      background: #1a2130;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .preview-box img, .preview-box video {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
      color: white;
    }

    .btn-ai { background: var(--ai-btn); }
    .btn-save { background: var(--success); }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div class="container">
  <h2>ระบบบันทึกข้อมูลสินค้า</h2>

  <!-- ส่วนอัปโหลดสื่อหลัก -->
  <div class="media-buttons">
    <label class="btn-media btn-file">
      📁 เลือกรูป / วิดีโอ
      <input type="file" id="mainFileInput" accept="image/*,video/*" style="display:none" onchange="handleMainFile(event)">
    </label>
    <label class="btn-media btn-camera">
      📷 ถ่ายรูป
      <input type="file" id="mainCameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleMainFile(event)">
    </label>
  </div>

  <div id="mainPreview" class="preview-box">ไม่มีสื่อแนบไว้</div>

  <!-- ฟอร์มป้อนข้อมูล -->
  <div class="form-group">
    <label>ชื่อ/รุ่น *</label>
    <input type="text" id="modelName" placeholder="เช่น 40SA5200 หรือ VETZ90L">
  </div>

  <div class="form-group">
    <label>รายละเอียด</label>
    <textarea id="description" rows="5" placeholder="รายละเอียดจาก AI หรือกรอกเอง..."></textarea>
  </div>

  <button type="button" class="btn-action btn-ai" onclick="analyzeWithAI()">✨ ค้นหารายละเอียดสินค้าด้วย AI (จากชื่อ/รุ่น)</button>
  <button type="button" class="btn-action btn-save" onclick="saveProductToCloud()">บันทึกสินค้าลงคลาวด์</button>
</div>

<!-- Modal สำหรับแก้ไขสินค้าและเปลี่ยน/ลบรูป -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeEditModal()">&times;</span>
    <h3 style="margin-bottom: 15px;">แก้ไขข้อมูลสินค้า</h3>

    <!-- กรอบแสดงและเปลี่ยนสื่อ -->
    <div id="editMediaPreview" class="preview-box">ไม่มีสื่อแนบไว้</div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <label class="btn-media btn-file" style="margin: 0;">
        📁 เปลี่ยนรูป / วิดีโอ
        <input type="file" id="editFileInput" accept="image/*,video/*" style="display:none" onchange="handleEditFile(event)">
      </label>
      <button type="button" id="btnDeleteMedia" onclick="deleteEditMedia()" class="btn-media" style="background: var(--danger); color: white; display: none;">
        🗑️ ลบสื่อ
      </button>
    </div>

    <div class="form-group">
      <label>ชื่อ/รุ่น *</label>
      <input type="text" id="editModelName">
    </div>

    <div class="form-group">
      <label>รายละเอียด</label>
      <textarea id="editDescription" rows="5"></textarea>
    </div>

    <button type="button" class="btn-action btn-save" onclick="saveEditProduct()">💾 บันทึกการแก้ไข</button>
  </div>
</div>

<script>
  // 1. ตั้งค่า Config ของระบบ
  const WORKER_URL = "https://YOUR_WORKER.workers.dev"; // ใส่ URL Worker ของคุณ
  const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME";       // ใส่ Cloud Name
  const CLOUDINARY_PRESET = "YOUR_UPLOAD_PRESET";         // ใส่ Upload Preset

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ตัวแปรสถานะ
  let currentMainFile = null;
  let currentEditItem = null;
  let currentEditFile = null;

  // 2. จัดการไฟล์หลัก
  function handleMainFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    currentMainFile = file;
    renderPreview('mainPreview', URL.createObjectURL(file), file.type.startsWith('video') ? 'video' : 'image');
  }

  function renderPreview(elementId, url, type) {
    const el = document.getElementById(elementId);
    if (!url) {
      el.innerHTML = 'ไม่มีสื่อแนบไว้';
      return;
    }
    if (type === 'video') {
      el.innerHTML = `<video src="${url}" controls></video>`;
    } else {
      el.innerHTML = `<img src="${url}">`;
    }
  }

  // 3. เรียก AI วิเคราะห์
  async function analyzeWithAI() {
    const modelName = document.getElementById('modelName').value.trim();
    if (!modelName) return alert('กรุณากรอกชื่อ/รุ่นสินค้า');

    const descBox = document.getElementById('description');
    descBox.value = 'กำลังวิเคราะห์ด้วย AI...';

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `วิเคราะห์สเปกรุ่น: ${modelName}` }] }] })
      });
      const data = await res.json();
      const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'ไม่พบข้อมูล';
      descBox.value = aiText;
    } catch (err) {
      descBox.value = 'เกิดข้อผิดพลาดในการเชื่อมต่อ AI';
    }
  }

  // 4. บันทึกสินค้าใหม่
  async function saveProductToCloud() {
    const modelName = document.getElementById('modelName').value.trim();
    const description = document.getElementById('description').value.trim();
    if (!modelName) return alert('กรุณากรอกชื่อ/รุ่นสินค้า');

    let mediaUrl = '', mediaType = '', publicId = '';

    if (currentMainFile) {
      const uploaded = await uploadToCloudinary(currentMainFile);
      if (uploaded) {
        mediaUrl = uploaded.secure_url;
        mediaType = uploaded.resource_type;
        publicId = uploaded.public_id;
      }
    }

    await db.collection('products').add({
      modelName, description, mediaUrl, mediaType, publicId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert('บันทึกสินค้าเรียบร้อยแล้ว!');
    location.reload();
  }

  // 5. ระบบแก้ไขข้อมูล & เปลี่ยน/ลบรูปภาพ/วิดีโอ
  function openEditModal(item) {
    currentEditItem = item;
    currentEditFile = null;

    document.getElementById('editModelName').value = item.modelName || '';
    document.getElementById('editDescription').value = item.description || '';
    
    renderPreview('editMediaPreview', item.mediaUrl, item.mediaType);
    document.getElementById('btnDeleteMedia').style.display = item.mediaUrl ? 'inline-block' : 'none';
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  function handleEditFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    currentEditFile = file;
    const type = file.type.startsWith('video') ? 'video' : 'image';
    renderPreview('editMediaPreview', URL.createObjectURL(file), type);
    document.getElementById('btnDeleteMedia').style.display = 'inline-block';
  }

  async function deleteEditMedia() {
    if (!confirm('ต้องการลบสื่อนี้ใช่หรือไม่?')) return;

    if (currentEditItem.publicId) {
      await deleteFromCloudinary(currentEditItem.publicId, currentEditItem.mediaType);
    }

    currentEditItem.mediaUrl = '';
    currentEditItem.mediaType = '';
    currentEditItem.publicId = '';
    currentEditFile = null;

    renderPreview('editMediaPreview', null, null);
    document.getElementById('btnDeleteMedia').style.display = 'none';
  }

  async function saveEditProduct() {
    if (!currentEditItem) return;

    let mediaUrl = currentEditItem.mediaUrl;
    let mediaType = currentEditItem.mediaType;
    let publicId = currentEditItem.publicId;

    // หากมีการอัปโหลดสื่อใหม่
    if (currentEditFile) {
      if (publicId) await deleteFromCloudinary(publicId, mediaType); // ลบไฟล์เก่า
      
      const uploaded = await uploadToCloudinary(currentEditFile);
      if (uploaded) {
        mediaUrl = uploaded.secure_url;
        mediaType = uploaded.resource_type;
        publicId = uploaded.public_id;
      }
    }

    await db.collection('products').doc(currentEditItem.id).update({
      modelName: document.getElementById('editModelName').value.trim(),
      description: document.getElementById('editDescription').value.trim(),
      mediaUrl, mediaType, publicId,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert('บันทึกการแก้ไขเรียบร้อยแล้ว');
    closeEditModal();
    location.reload();
  }

  // Helper Functions
  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
      method: 'POST', body: formData
    });
    return await res.json();
  }

  async function deleteFromCloudinary(pubId, type) {
    try {
      await fetch(`${WORKER_URL}/delete-media`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ publicId: pubId, resourceType: type })
      });
    } catch (e) {
      console.error('Delete Media Error:', e);
    }
  }
</script>
</body>
</html>
