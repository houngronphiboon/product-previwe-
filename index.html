<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกสินค้า (Cloudinary + Firestore)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .preview-box { border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 5px; margin-top: 10px; min-height: 150px; display: flex; align-items: center; justify-content: center; }
        .preview-box img, .preview-box video { max-width: 100%; max-height: 250px; border-radius: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; color: white; border-radius: 5px; display: none; z-index: 1000; }
        .toast.info { background-color: #17a2b8; }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>เพิ่มข้อมูลสินค้า</h2>
    <div class="form-group">
        <label for="product-name">ชื่อสินค้า *</label>
        <input type="text" id="product-name" placeholder="กรอกชื่อสินค้า">
    </div>
    <div class="form-group">
        <label for="product-detail">รายละเอียดสินค้า</label>
        <textarea id="product-detail" rows="3" placeholder="กรอกรายละเอียด"></textarea>
    </div>
    <div class="form-group">
        <label>เลือกไฟล์ (รูปภาพ หรือ วิดีโอ)</label>
        <input type="file" id="media-file" accept="image/*,video/*" onchange="handleFileSelect(event)">
        <div class="preview-box" id="preview-box">
            <span>[กรอบแสดงรูปภาพ / วิดีโอ]</span>
        </div>
    </div>
    <button id="btn-save" onclick="addProduct()">บันทึกสินค้าลงคลาวด์</button>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase SDK (ใช้เฉพาะ Firestore Database เท่านั้น) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. ใส่ Config ของ Firebase ที่คุณมีอยู่เดิม
  const firebaseConfig = {
      apiKey: "ใส่_API_KEY_ของ_FIREBASE",
      authDomain: "ใส่_AUTH_DOMAIN_ของ_FIREBASE",
      projectId: "ใส่_PROJECT_ID_ของ_FIREBASE",
      storageBucket: "ใส่_STORAGE_BUCKET_ของ_FIREBASE",
      messagingSenderId: "ใส่_MESSAGING_SENDER_ID",
      appId: "ใส่_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ตัวแปรสำหรับเก็บไฟล์สื่อ
  let processedMedia = { type: 'none', file: null };

  // 2. ฟังก์ชันพรีวิวไฟล์สื่อ
  window.handleFileSelect = function(event) {
      const file = event.target.files[0];
      const previewBox = document.getElementById('preview-box');
      if (!file) return;

      const isVideo = file.type.startsWith('video/');
      processedMedia = { type: isVideo ? 'video' : 'image', file: file };

      const url = URL.createObjectURL(file);
      if (isVideo) {
          previewBox.innerHTML = `<video src="${url}" controls></video>`;
      } else {
          previewBox.innerHTML = `<img src="${url}" alt="Preview">`;
      }
  };

  // 3. ฟังก์ชันสำหรับอัปโหลดสื่อตรงไปที่ Cloudinary (ไม่ผ่าน Firebase Storage)
  async function uploadToCloudinary(file) {
      const cloudName = "qxbrnyx"; // Cloud Name ของคุณจากหน้า Dashboard
      const uploadPreset = "ainote_preset"; // Upload Preset ที่ตั้งค่าแบบ Unsignedไว้

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', uploadPreset);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/auto/upload`, {
          method: 'POST',
          body: formData
      });

      if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || "อัปโหลดไปยัง Cloudinary ไม่สำเร็จ");
      }

      const data = await response.json();
      return data.secure_url;
  }

  // 4. ฟังก์ชันหลักสำหรับบันทึกสินค้า
  window.addProduct = async function() {
      const nameInput = document.getElementById('product-name');
      const detailInput = document.getElementById('product-detail');
      const saveBtn = document.getElementById('btn-save');
      const name = nameInput.value.trim();
      const detail = detailInput.value.trim();

      if (!name) {
          showToast("กรุณากรอกชื่อสินค้า", "error");
          return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "กำลังบันทึกลง Cloud...";

      try {
          let mediaUrl = "";

          // ถ้ามีการเลือกไฟล์ ให้ส่งไปอัปโหลดที่ Cloudinary
          if (processedMedia.file) {
              showToast(`กำลังอัปโหลด${processedMedia.type === 'video' ? 'วิดีโอ' : 'รูปภาพ'}ขึ้น Cloudinary...`, "info");
              mediaUrl = await uploadToCloudinary(processedMedia.file);
          }

          // นำ URL ที่ได้จาก Cloudinary และข้อมูลสินค้า เซฟลง Firestore
          await addDoc(collection(db, "products"), {
              name: name,
              detail: detail || "ไม่มีรายละเอียดเพิ่มเติม",
              mediaType: processedMedia.type,
              mediaUrl: mediaUrl,
              createdAt: Date.now()
          });

          showToast("บันทึกข้อมูลเรียบร้อยแล้ว!", "success");
          
          // ล้างค่าในหน้าเว็บ
          nameInput.value = ''; 
          detailInput.value = '';
          document.getElementById('media-file').value = '';
          document.getElementById('preview-box').innerHTML = '<span>[กรอบแสดงรูปภาพ / วิดีโอ]</span>';
          processedMedia = { type: 'none', file: null };

      } catch (e) {
          console.error("Save Error:", e);
          showToast("บันทึกไม่สำเร็จ: " + e.message, "error");
      } finally {
          saveBtn.disabled = false;
          saveBtn.innerText = "บันทึกสินค้าลงคลาวด์";
      }
  };

  // แจ้งเตือน Toast
  function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast ${type}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }
</script>

</body>
</html>
